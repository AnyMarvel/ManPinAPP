SiginkeyPassword=52Shanshan!
android.injected.testOnly=false
android.useAndroidX=true
android.enableJetifier=true
# AGP 8 默认 nonTransitiveRClass=true，此处保留旧行为以减少 R 引用破坏
android.nonTransitiveRClass=false
# AGP 8 默认 nonFinalResIds=true 会让 app 模块 R.id 变成非 final，
# 导致 @BindView(R.id.x) 与 switch/case R.id.x 报"需要常量表达式"。设 false 恢复 final 常量。
android.nonFinalResIds=false
# AGP 8 已移除 android.enableD8（D8 为默认），故不再声明