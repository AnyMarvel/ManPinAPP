apply plugin: 'com.android.application'

android {
    namespace "com.mp.android.apps"
    compileSdk 34
    defaultConfig {
        applicationId "com.mp.android.apps"
        minSdkVersion 21
        //Android 11 高版本 出现外部存储无法访问的问题
        //https://blog.csdn.net/shellcodelw/article/details/122718045
        targetSdkVersion 28
        versionCode 51
        versionName "3.0.1"
        multiDexEnabled true
        multiDexKeepProguard file("multidexKeep.pro")
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            v1SigningEnabled true
            v2SigningEnabled true
            storeFile rootProject.file('AnyMarvel.jks')
            storePassword SiginPassword
            keyAlias SiginkeyAlias
            keyPassword SiginkeyPassword
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // release 正式签名文件 AnyMarvel.jks 存在时用它；缺失时回退 debug.keystore
            // (个人自用可直接出包；正式发布请放置 AnyMarvel.jks)
            signingConfig rootProject.file('AnyMarvel.jks').exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }

    }
    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }
    buildFeatures {
        // AGP 8 默认关闭 BuildConfig 生成，代码中用到 BuildConfig，需显式开启
        buildConfig true
        // AGP 8 默认关闭 AIDL，工程有 IDownloadBookInterface.aidl(下载服务跨进程接口)，需开启
        aidl true
    }
    lint {
        // 个人自用、不上架 Google Play：targetSdk 28 为兼容外部存储访问而有意保留。
        // AGP 8 的 Lint DSL 属性需用 +=/= 赋值(方法调用式对新 DSL 集合不生效)。
        disable += 'ExpiredTargetSdkVersion'
        abortOnError = false
        checkReleaseBuilds = false
    }
}


dependencies {

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.9.0'  // 更新版本
    implementation 'androidx.appcompat:appcompat:1.6.1'  // 更新到稳定版本

    //下拉刷新库
    // 坐标已从 com.scwang.smart(仅在已死的jcenter) 迁移到 io.github.scwang90(mavenCentral)
    // 代码包名仍为 com.scwang.smart.refresh.*，import 无需修改
    implementation 'io.github.scwang90:refresh-layout-kernel:2.1.0'  //核心
    implementation 'io.github.scwang90:refresh-header-classics:2.1.0'    //经典刷新头
    implementation 'io.github.scwang90:refresh-footer-classics:2.1.0'    //经典加载

    implementation 'androidx.multidex:multidex:2.0.1'
    //glide图片库依赖 - 更新到最新稳定版本
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    //fastjson存在安全漏洞，建议更新到最新版本或使用gson替代
    implementation 'com.alibaba:fastjson:1.2.83'  // 更新到修复安全漏洞的版本

    implementation files('libs/jcc-bate-0.7.3.jar')

    //https://github.com/xdrop/fuzzywuzzy
    //https://samperson1997.github.io/2018/05/09/fuzzywuzzy/ 字符串相似度排序
    implementation 'me.xdrop:fuzzywuzzy:1.4.0'


//    https://github.com/azhon/AppUpdate
    implementation 'io.github.azhon:appupdate:4.2.9'//update

    //loading 圈
    implementation 'com.victor:lib:1.0.4'
    //动态权限适配
    implementation 'com.mylhyl:acp:1.2.0'
    //butterknife
    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'

    //opencc lib
    implementation "com.zqc.opencc.android.lib:lib-opencc-android:0.8.0@aar"

    //GreenDao
    api 'org.greenrobot:greendao:3.3.0'
    api 'org.greenrobot:greendao-generator:3.3.0'
    //JSOUP
    api 'org.jsoup:jsoup:1.10.2'
    //沉浸式状态栏
    api 'com.zhangmonke:ImmerseLayout:1.1.1'
    //ProgressBar
    api 'com.zhangmonke:MProgressBar:1.0.1'
    //greenDao的数据库升级
    api 'io.github.yuweiguocn:GreenDaoUpgradeHelper:v2.2.1'
    //AutofitTextView
    api 'me.grantland:autofittextview:0.2.1'
    //删除粒子效果
    api 'tyrantgit:explosionfield:1.0.1'
    //View简易动画
    api 'com.daimajia.easing:library:2.0@aar'
    api 'com.daimajia.androidanimations:library:2.2@aar'
    //CircleImageView
    api 'de.hdodenhof:circleimageview:2.1.0'
    //SwitchButton
    api 'com.kyleduo.switchbutton:library:1.4.4'
    api 'com.victor:lib:1.0.4'
    api files('libs/commons-codec-1.10-sources.jar')
    api files('libs/juniversalchardet-1.0.3.jar')

    //RxAndroid - 更新到最新稳定版本
    api 'io.reactivex.rxjava2:rxandroid:2.1.1'
    api 'io.reactivex.rxjava2:rxjava:2.2.21'  // 更新到最新2.x版本

    //Rxlifecycle - 更新到最新版本
    api 'com.trello.rxlifecycle2:rxlifecycle:2.2.2'
    api 'com.trello.rxlifecycle2:rxlifecycle-android:2.2.2'
    // If you want to bind to Android-specific lifecycles
    api 'com.trello.rxlifecycle2:rxlifecycle-components:2.2.2'
    // If you want pre-written Activities and Fragments you can subclass as providers
    api 'com.trello.rxlifecycle2:rxlifecycle-navi:2.2.2'  // If you want to use Navi for providers
    api 'com.trello.rxlifecycle2:rxlifecycle-kotlin:2.2.2' // If you want to use Kotlin syntax

    //Retrofit - 更新到最新稳定版本
    api 'com.squareup.retrofit2:retrofit:2.9.0'
    api 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
    api 'com.squareup.retrofit2:converter-gson:2.9.0'
    api 'com.squareup.retrofit2:converter-scalars:2.9.0'
    api ('com.github.ihsanbal:LoggingInterceptor:3.1.0') {
        exclude group: 'org.json', module: 'json'
    }

    //RxBus
    api('com.hwangjr.rxbus:rxbus:2.0.0-beta') {
        exclude group: 'com.jakewharton.timber', module: 'timber'
    }

}

// 说明：greenDAO 的 Gradle 插件(org.greenrobot.greendao)不兼容 AGP 8，已移除。
// 其生成的 DAO 代码(DaoMaster/DaoSession/xxxDao)已提交在 src/main/java/com/mp/android/apps/book/dao，
// 编译不受影响；仅"修改 @Entity 后自动重新生成"的能力失效，需要时用旧工程/独立模块生成后覆盖。